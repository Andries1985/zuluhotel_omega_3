Elem Settings
{
	// MaxIdleTime - Number of days an account can go unused before it gets deleted.
	// If set to 0, feature is disabled.
	MaxIdleTime		7
	
	// OnlyAutoDeleteEmpties 
	// 0 - Default. Deletes any account that has been idle too long.
	// 1 - Enabled. Only deletes idle accounts with no characters on them.
	OnlyAutoDeleteEmpties	1
	
	// AllowAutoAccounts - Controls client logins with account names that do not exist yet.
	// 0 - Default. Does nothing
	// 1 - Enabled. Creates the account if it does not yet exist.
	AllowAutoAccounts	0
	
	// AllowWWWAccounts - Controls if accounts can be created with the web server.
	// 0 - Default. Disables account creation through the web server.
	// 1 - Enabled. Allows accounts to be made through the web server.
	AllowWWWAccounts	0
	
	// If set, the password must be sent to the aux and web script to allow them to make an account.
	// Make sure to not use weird special characters that can't be converted by POL in a URL string.
	// POL supports limited URI escape values.
	WebPassword             
	
	// Default UO expansion to set on an account when it is created.
	DefaultExpansion	TOL
	
	// MaxLoginFailures
	// Number of failures, all within FailureInterval, before account is disabled FOR THAT IP.
	MaxLoginFailures	5
	
	// DisableLength
	// Length of time, in minutes, to disable account.
	DisableLength		10
	
	// DisableGrace
	// If account is disabled and there is an attempt to login again, the disabled timer will NOT
	// be reset to DisableLength IF the amount of time to be disabled is less than or equal too DisableGrace.
	DisableGrace		20
	
	// FailureInterval
	// Amount of time between failures, in seconds, that failures most occur for them to be counted
	// towards MaxLoginFailures.
	// 2026-09-21: 3 -> 180. At 3 seconds, one guess every 4 seconds never added up to
	// MaxLoginFailures, so the lockout in hook/onLogin.src could not trigger against slow guessing.
	FailureInterval  180

	// DebugAccountsPolicy
	// 0 - Default. Disable account policy and household command debug console prints.
	// 1 - Enabled. Print [ACCTDBG] traces to POL console via Print().
	DebugAccountsPolicy  0

	// Login policy (2026-10-01). The rules are enforced in :accounts:include/accounts.inc:
	// per DiscordID at most MaxDiscordsOnline characters online, all of them from one IP,
	// and no other DiscordID on that IP unless both are in one household. Staff are exempt.
	// Households are managed with the .household* commands, DiscordIDs with .mkaccount
	// and .setdiscord.

	// MaxDiscordsOnline
	// Characters one DiscordID may have online at once (two on one account, or one on
	// each of two accounts).
	MaxDiscordsOnline	2

	// MaxAccountsPerDiscord
	// Accounts one DiscordID may hold. Checked when an account is created (.mkaccount) or
	// given a DiscordID (.setdiscord); accounts that already exist are not touched.
	// 0 - no limit.
	MaxAccountsPerDiscord	2

	// DefaultHouseholdCap
	// The cap a new household starts with: how many different DiscordIDs of the household
	// may be online from one IP together. Raise it per household with .householdcap.
	DefaultHouseholdCap	2
}

