// native container view (same pattern as pkg/items/keys/keyRing).
Container 0x2259
{
	Name			bulkorderbook
	Desc			a bulk order book
	Graphic			0x2259
	Weight			5
	Gump			0x003C
	MinX			44
	MaxX			143
	MinY			65
	MaxY			140
	MaxWeight		0
	Lockable		0
	Newbie			1
	VendorSellsFor	10
	VendorBuysFor	5
	CanInsertScript	:bulkorders:bulkorderbook_caninsert
	Script			bulkorderbook
	DestroyScript	::maindestroy
}
