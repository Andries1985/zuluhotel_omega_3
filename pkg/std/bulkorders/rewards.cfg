// Bulk Order Deeds -- reward catalog (Phase 4).
//
// One shared catalog, spent from the shared points ledger (see
// bulkorder_ledger.inc). GM-editable: add more BulkOrderReward blocks here
// to expand the catalog -- Cost is in points, Objtype is what gets created
// in the redeemer's backpack.

BulkOrderReward OmegaToken
{
	Name     Omega Token
	Cost     36
	Objtype  0x4000AA
}

BulkOrderReward RunicAtlas
{
	// Priced at what 25 Omega Tokens would cost (25 * 36), not tied to any
	// specific craft's Large BOD catalog -- a flat points-shop reward.
	Name     Runic Atlas
	Cost     900
	Objtype  0x9C16
}

