// Bulk Order Deeds -- curated Large BOD Templates catalog (Phase 3).
//
// One BulkOrderTemplate block per template, keyed by a unique
// "<Craft>_<TemplateName, no spaces>" string. Replaces a fully-random N-item
// draw with a small, named, learnable shopping list per craft, matching the
// locked "Large BOD Templates" companion artifact exactly (93 templates
// across 8 crafts, source of truth for names/items/exclusions). Generation
// rolls one template uniformly, then (material-tiered crafts) one shared
// material via the quadratic Difficulty curve, then one shared
// exceptional-requirement -- the template only fixes *which* items.

