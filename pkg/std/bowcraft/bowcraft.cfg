// "Improve" recipes -- upgrade an already-made plain Arrow/Bolt straight into
// its elemental version using just the matching reagent, instead of consuming
// fresh Shafts+Feathers. ResultObjtype is needed because 0x6051/0xb200/0x824e
// are already taken as keys by the from-scratch entries above -- these use
// synthetic keys (0x700001-0x700003, well outside any real objtype/button-id
// range) and ResultObjtype says what actually gets created.

Element 0x700001
{
	Name			Improve Arrow to Fire Arrow
	Category		Ammo
	Material		1
	MaterialType		Arrow
	Material2		1
	Material2Type		Reagent
	Material2Objtype	0xf8c
	Skill			114
	Bulk			1
	ResultObjtype		0x6051
}

Element 0x700002
{
	Name			Improve Arrow to Ice Arrow
	Category		Ammo
	Material		1
	MaterialType		Arrow
	Material2		1
