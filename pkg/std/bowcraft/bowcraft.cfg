// Recipe data for the OSI-style bowcraft crafting gump (bowcraft.src).
//
// MaterialType/Material2Type/Material3Type tell the gump which objtype family
// to offer in the material picker: Log (any color, uses :carpentry:carpentry
// for name/quality/difficulty), Shaft/Feather/Arrow/Bolt (single fixed
// objtype, no choice to make, picker step is skipped), Reagent (single fixed
// objtype via MaterialNObjtype).

