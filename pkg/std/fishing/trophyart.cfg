# Driven by pkg/std/fishing/fishing.inc's PickTrophyGraphic(). Keyed by the caught item's own
# .graphic - the shared body-shape art a species is built from (itemdesc.cfg's "Graphic" field,
# e.g. Lavafisheast/Unicornfisheast both use 0x337D - the "Fish9" shape). Each entry here is a
# confirmed exact match (same facing) verified against the actual client art, not a guess from
# item Desc text.
#
# A caught item whose .graphic has no entry here falls back to the single "Generic" pool below.

