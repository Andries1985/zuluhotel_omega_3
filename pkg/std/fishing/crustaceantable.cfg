# Driven by pkg/std/fishing/crustaceantrap.inc's PickCrustaceanFromTier().
# Kept in sync by hand with the CProps on the matching Item entries in itemdesc.cfg's
# Regular/Rare/Legendary Crustacean sections - if you add/change a crustacean there,
# update this file too. Same schema as catchtable.cfg (fish); crustaceans are caught
# exclusively via the crustacean trap, not the pole/net.
#
# Tier: Regular | Rare | Legendary
# Regular crustaceans use a single Objtype. Rare/Legendary use ObjtypeEast/ObjtypeSouth
# (the catch picks one at random) since they were built with both facings.
# Location (optional): Deep Water | Shores | Dungeons - must match GetFishingLocation().
# Realm (optional): a realm identifier (britannia_alt, malas, tokuno, ilshenar, termur) -
# must match character.realm exactly.
# MinSkill (optional): effective Fishing skill required (Rare/Legendary only).
# A crustacean with neither Location nor Realm set is eligible everywhere.

