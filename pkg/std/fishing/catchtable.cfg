# Driven by pkg/std/fishing/fishing.inc's PickFishFromTier().
# Kept in sync by hand with the CProps on the matching Item entries in itemdesc.cfg -
# if you add/change a fish there (Regular/Rare/Legendary Fish sections only -
# Crustaceans and Quest Fish are wired separately and are NOT listed here),
# update this file too.
#
# Tier: Regular | Rare | Legendary
# Regular fish use a single Objtype. Rare/Legendary fish use ObjtypeEast/ObjtypeSouth
# (the catch picks one at random) since they were built with both facings.
# Location (optional): Deep Water | Shores | Dungeons - must match GetFishingLocation().
# Realm (optional): a realm identifier (britannia, britannia_alt, malas, tokuno,
# ilshenar, termur) - must match character.realm exactly.
# MinSkill (optional): effective Fishing skill required (Rare/Legendary only).
# A fish with neither Location nor Realm set is eligible everywhere.

