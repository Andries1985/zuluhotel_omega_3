# ########################################
# #   Donation Box (east)
# #
# # Custom objtype 0xf703 (reserved in objtypes.txt) so the entry is not
# # tied to a vanilla chest. Graphic uses 0xB4B9.
# # Unmovable public chest. Anything dropped in is tagged with the donor
# # serial and game-clock timestamp via the OnInsert hook. The sweeper
# # script (:donationbox:scripts/sweeper) deletes contents older than
# # one week. Removing an item clears the donation tag.
# ########################################
Container 0xf703
{
	Name				DonationBoxEast
	Desc				donation box
	Graphic				0xB4B9
	Gump				0x4A
	MinX				18
	MaxX				162
	MinY				105
	MaxY				178
	MaxItems			255
	MaxWeight			65535
	Lockable			0
	Movable				0
	Decay				0
	NoDrop				1
	RequiresAttention	0
	Script				:containers:container/use
	MethodScript		:containers:container/method
	CanInsertScript		:donationbox:scripts/canInsert
	CanRemoveScript		:donationbox:scripts/canRemove
	OnInsertScript		:donationbox:scripts/onInsert
	OnRemoveScript		:donationbox:scripts/onRemove
	DestroyScript		:donationbox:scripts/canDestroy
	CreateScript		:donationbox:scripts/onCreate
	BaseMaterial		Metal
}

# ########################################
