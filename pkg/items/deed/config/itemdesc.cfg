################################
#
# Item <objnumber>
# {
#  Name				<item creation name>
#  Desc				<description of item in game>
#  Graphic			0x14EF
#  Weight			1
#  Script     	    <use script>
#  MethodScript		<method script>
#  BuildCFG			<path to cfg file where item setup is stored>
#  CanDye			<1/0> for deeds that allow players to dye them. Useful specifically for things like carpets and curtain deeds.
#  RetainColor		<1/0 of whether items created from deed retain the deed's color>
# }
# Reserved Item Numbers: 0xDEED000 - 0xDEED0FF (original block, now full)
# Extended range (backfill 2026-09-12): 0xDEED100 - 0xDEED1C3
# 138 of the 196 backfilled items ended up deeded; 58 IDs in this range are
# intentionally unused (rotate-script items excluded per Rule 0 in
# feedback_new_deed_item_workflow memory -- deeding breaks their rotate).
# Do not reuse the gaps for something else without checking that memory first.
# Crafting-station rollout range (2026-09-12, same day): 0xDEED1BF - 0xDEED1DD
# (0xDEED1C1/0xDEED1C3 deliberately skipped). Next free ID is 0xDEED1DE.
################################

