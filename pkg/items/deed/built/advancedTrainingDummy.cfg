################################################################
# Build 1075386
#	{
#		Component	<ObjType> <X> <Y> <Z> <Color>
#		Component	<ObjType> <X> <Y> <Z> <Color>
#	}
# Note:
#		color - overwrites deed color
#
# Explanation:
#	Build: Followed by a corresponding cliloc 
#	number that tells the script which 
#	facing the item will be. The numbers are 
#	as follows:
#	1075386 - South
#	1075387 - East
#	1075389 - North
#	1075390 - West
#	1		- Denotes a single item
#
#	Component: corresponds to the different
#	pieces the deed will place, you can have
#	as many components as is needed to complete
#	an item. The parameters required is object type,
#	x-offset from the target & y-offset from target.
################################################################
//East
Build 1075387
{
	Component 	0x9834 0 0 0
	Component 	0x9842 0 -1 0
	Component 	0x9840 0 0 0
	Component 	0x983E 0 1 0
	Component 	0x983F -1 1 0
	Component 	0x9841 1 1 0
	Component 	0x9843 -1 -1 0
	Component 	0x983D 1 -1 0
}
//South
Build 1075386
{
	Component	0x9835 0 0 0
	Component	0x983B -1 0 0
	Component	0x9839 0 0 0
	Component	0x9837 1 0 0
	Component	0x983A -1 1 0
	Component	0x983C -1 -1 0
	Component	0x9836 1 1 0
	Component	0x9838 1 -1 0
}