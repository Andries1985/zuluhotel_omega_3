///////////////////////////////////////////////////////////////////////////////
//
// Currency is intentionally near-weightless: a full 60,000 stack of any
// of the three coin types weighs 1 stone.
//
////////////////////////////////////////////////////////////////////////////////
Item 0x0EED
{
    Name            goldcoin
    desc            Gold Coin%s%
	MethodScript	:currency:coins/methods
	Script			:blacksmithy:blacksmithy
	DestroyScript	::maindestroy
    InsertNoise     sound_gold1in
	Weight			1/60000
}

Item 0x0EF0
{
    Name            silvercoin
	Color	    	1154
    desc            Silver Coin%s%
	MethodScript	:currency:coins/methods
	DestroyScript	::maindestroy
    InsertNoise     sound_gold1in
	Weight			1/60000
}

// The graphic for copper coins doesn't stack properly.
// So I am using the gold coin graphic.
Item 0x0EEA
{
    Name            coppercoin
    Color	    	0x5DE
    desc            Copper Coin%s%
	MethodScript	:currency:coins/methods
	DestroyScript	::maindestroy
    InsertNoise     sound_gold1in
	Weight			1/60000
}

Item 0x14000
{
	Name			bankersorder
	Desc			Banker's Order
	Graphic			0x14EF
	Script			:currency:BankersOrder/bankersOrder
	DestroyScript	::maindestroy
	Weight			1/12
	newbie			1
}
