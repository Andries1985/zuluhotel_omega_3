	GiverName	Cinderwarden Rudyom

	ObjText1	Slay Nethrazul the Bloodwyrm in Alryc's Inferno
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Blood Seeking.
	RewardGold	500
	RewardItem	0xBA69
}

