// and boss (NpcTemplate nethrazulbloodwyrm) are at the very bottom of Alryc's
// Inferno, the fourth and final level -- the chain's hardest fight.
// Non-repeatable, same abandon/re-accept retry path.
Quest 15
{
	Name		The Rite of Blood Seeking
	Description	Nothing that reaches the bottom of Alryc's Inferno leaves the way it came in -- Nethrazul sees to that. Every blade broken against its hide, every adventurer who never climbed back out, has fed a hunger that fire alone can't satisfy. The Rite of Blood Seeking offers a weapon to that same fury, sanctifying it in blood so all felled by its edge become tribute to Fire's glory -- but you'll need to face what real tribute looks like first. Offer Blood Moss, Spider Silk, Executioner's Cap, and Bone to the inferno's altar to draw it out, then slay it and bring back proof.
