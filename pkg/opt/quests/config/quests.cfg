	Description	Past even Malachar's reach, in a boss chamber the necropolis keeps sealed off from the rest of its halls, something older and far worse than a lich still moves -- Vharesh, the Deathless Tyrant, wearing a dragon's bones like armor and a hatred centuries deep. The Rite of Racial Theurgy summons the strongest of the abyss's vengeful spirits and binds their hatred to a weapon, turning old suffering into an edge -- but you'll need to survive what Vharesh's own suffering has become before I trust you with a working that dangerous. Offer Mandrake Root, Black Pearl, Executioner's Cap, and Eye of Newt to the boss chamber's altar to draw it out, then slay it and bring back proof.
