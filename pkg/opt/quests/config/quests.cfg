//////////////////////////////////////////////////

// Fourth quest-giver area. Altar (Item 0xBA5E/0xBA5F "ritualaltar143ew/ns")
// and boss (NpcTemplate korrathironscaled) are in the Brimstone Catacombs of
// Alryc, the first level of the fire dungeon chain past Aetherfall Bridge.
// Non-repeatable, same abandon/re-accept retry path as every other ritual
// quest.
Quest 12
{
	Name		The Rite of Physical Ward
	Description	The Brimstone Catacombs are the first true test past Aetherfall Bridge -- and Korrath is the reason nobody who wanders in unarmored comes back out. Scaled in fused iron and ember, it doesn't so much fight as endure, shrugging off blows that would fell three lesser men before it. The Rite of Physical Ward is the working that grants that same endurance to an item -- but you'll need to see what real endurance looks like first. Offer Garlic, Sulphurous Ash, Obsidian, and Brimstone to the catacombs' altar to draw it out, then slay it and bring back proof.
	Giver		rudyom
	GiverName	Cinderwarden Rudyom

	ObjText1	Slay Korrath the Ironscaled in the Brimstone Catacombs of Alryc
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Physical Ward.
	RewardGold	500
	RewardItem	0xBA66
}

// Same shape as Quest 12, altar (Item 0xBA60/0xBA61 "ritualaltar147ew/ns")
// and boss (NpcTemplate vraxthelselfmending) are in Alryc's Magma Halls, the
// second level. Non-repeatable, same abandon/re-accept retry path.
Quest 13
{
	Name		The Rite of Quick Healing
	Description	Deeper in, the Magma Halls hold Vraxthel -- a thing that shouldn't still be standing after half of what's been thrown at it, yet knits itself whole again between one breath and the next. Adventurers who've studied it swear its wounds close faster than they're dealt. The Rite of Quick Healing draws on that same swiftness, on Water's own claim as the source of all life -- but you'll need to watch Vraxthel mend itself at least once to understand what you're asking an item to hold. Offer Ginseng, Mandrake Root, Dragon's Blood, and Volcanic Ash to the halls' altar to draw it out, then slay it and bring back proof.
	Giver		rudyom
	GiverName	Cinderwarden Rudyom

	ObjText1	Slay Vraxthel the Self-Mending in Alryc's Magma Halls
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Quick Healing.
	RewardGold	500
	RewardItem	0xBA67
}

// Same shape as Quest 12, altar (Item 0xBA62/0xBA63 "ritualaltar154ew/ns")
// and boss (NpcTemplate ashkelonsoulrent) are in Alryc's Hellfire Abyss, the
// third level. Non-repeatable, same abandon/re-accept retry path.
Quest 14
{
	Name		The Rite of Vital Infusion
	Description	The Hellfire Abyss doesn't just kill what wanders too deep -- Ashkelon takes something more, drawing the last vitality out of the fallen and folding it into itself, stronger with every kill it's claimed. The Rite of Vital Infusion draws on that same well, the countless memories of all who have fallen and returned to the earth -- but you'll need to see exactly what Ashkelon has already taken before I trust you with the rite that does it properly. Offer Black Pearl, Nightshade, Daemon Bone, and Pumice to the abyss's altar to draw it out, then slay it and bring back proof.
	Giver		rudyom
	GiverName	Cinderwarden Rudyom

	ObjText1	Slay Ashkelon the Soulrent in Alryc's Hellfire Abyss
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Vital Infusion.
	RewardGold	500
	RewardItem	0xBA68
}

