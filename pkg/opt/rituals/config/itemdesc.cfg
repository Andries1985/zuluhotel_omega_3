//--=[ RITUAL QUEST ALTARS ]=-------------------------
// Standard two-piece ritual altar. Graphic 0x2A9A (E/W anchor) auto-spawns a
// companion piece at 0x2A9B (-1 x, same y); 0x2A9C (N/S anchor) auto-spawns
// 0x2A9D (same x, -1 y) -- see pkg/opt/rituals/altar/create.src. Every
// ritual gets its OWN objtype here (same shared graphic/scripts, different
// baked-in CProps below) so each is individually .create-able by name, e.g.
// ".create ritualaltar134ew". Not usable at all unless RitualAltarQuestId is
// active for the clicking player (pkg/opt/rituals/altar/use.src). Name suffix
// marks facing -- "ew" (0x2A9A) or "ns" (0x2A9C) -- since orientation is fixed
// at creation and each needs its own objtype/Name to be individually .create-able.
//
// NOTE: CProp int values below are decimal, not 0x-hex -- confirmed the cfgfile
// CProp parser doesn't accept a "0x" literal after the "i" type prefix (silently
// yields 0 instead of erroring), which was why the altar gump showed no reagent
// lines/Summon failed. RitualAltarReagent1 3963 = 0x0F7B (Bloodmoss),
// RitualAltarReagent2 3978 = 0x0F8A (Pig Iron), RitualAltarTrophyObjtype
// 47679 = 0xBA3F (QuestSkull, Item 0xBA3F below).
//
// Consecration instance -- Dracham Cemetery / Quest 2 (quests.cfg).
Item 0xBA41
{
	Name		ritualaltar134ew
	Desc		a ritual altar
	Graphic		0x2A9A
	Movable		0
	SaveOnExit	0
	Facing		1
	CreateScript	:rituals:altar/create
	DestroyScript	:rituals:altar/destroy
	Script		:rituals:altar/use

	CProp		RitualAltarQuestId		i2
	CProp		RitualAltarRitualId		i134
	CProp		RitualAltarBossTemplate		svoranthunhallowed
	CProp		RitualAltarTrophyObjtype	i47679
	CProp		RitualAltarReagent1		i3963
	CProp		RitualAltarReagentAmt1		i50
	CProp		RitualAltarReagent2		i3978
	CProp		RitualAltarReagentAmt2		i50
}

// Same Consecration instance, N/S-facing (Graphic 0x2A9C auto-spawns its
// 0x2A9D companion at (same x, -1 y) -- see pkg/opt/rituals/altar/create.src).
// Orientation is picked at .create time, not changeable afterward -- use
// whichever objtype matches the wall/terrain the altar needs to sit against.
Item 0xBA42
{
	Name		ritualaltar134ns
	Desc		a ritual altar
	Graphic		0x2A9C
	Movable		0
	SaveOnExit	0
	Facing		1
	CreateScript	:rituals:altar/create
	DestroyScript	:rituals:altar/destroy
	Script		:rituals:altar/use

	CProp		RitualAltarQuestId		i2
	CProp		RitualAltarRitualId		i134
	CProp		RitualAltarBossTemplate		svoranthunhallowed
	CProp		RitualAltarTrophyObjtype	i47679
	CProp		RitualAltarReagent1		i3963
	CProp		RitualAltarReagentAmt1		i50
	CProp		RitualAltarReagent2		i3978
	CProp		RitualAltarReagentAmt2		i50
}

