//****************************************************************************************
//
//	Rituals spell registration - added 2026-08-26 as part of the revival pass.
//	This is the actual reason ritual scrolls no-op today: use.src looks up
//	spell_id via MS_GetSpellsCfgElem() against the shard-wide :*:spells
//	config, and nothing has ever defined this range.
//
//	SpellId and PowerWords are both mandatory to the core engine's spell
//	loader (pol-core/pol/spells.cpp: USpell::USpell reads them with no
//	default and throws if absent) even though nothing here casts these
//	rituals through the normal spellbook/mantra path - PowerWords is
//	flavor-only and never surfaced by use.src.
//
//	Circle is also required unless Mana/Difficulty/PointValue/Delay are all
//	supplied directly (same source file, USpellParams's fallback
//	constructor) - every other spells.cfg in this shard uses Circle rather
//	than per-spell overrides, so these do too, picked to roughly match each
//	ritual's own ManaCost below. The circle-derived Mana/Difficulty/etc are
//	otherwise inert for rituals: nothing here is cast through the normal
//	spellbook path, so config/circles.cfg's numbers are never read for these.
//
//	ManaCost	Read by RitualSkillCheck() - Gate 2's mana floor. This is
//			the number that actually matters for these rituals.
//	SpellScript	Full path read by use.src to start the ritual's own script.
//
//	Difficulty (Gate 1) and the Gate 2 success percentage are NOT config
//	fields here - they're computed per-ritual in rituals.inc's
//	GetRitualGateInfo(), since 8 of these rituals need a value that depends
//	on the target item's current tier, not a single fixed number. See the
//	Ritual Failure Ledger companion doc for the full band table; ManaCost
//	below is a first-pass placeholder within that same balance pass, ready
//	for tuning.
//
//****************************************************************************************

