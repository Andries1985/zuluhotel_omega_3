// Arcomage card list -- generated 2026-10-23 by a one-shot script from the arcomage-hd
// remake (github.com/arcomage/arcomage-hd, MIT code, src/data/cards.ts). The numbers
// (cost, draw weight, effects) are the remake's; names and text are our own reskin.
// The '// #n Original Name' line above each block is the reference back to the remake.
//
// Fields:
//   Name           shown on the card
//   Text           shown on the card
//   Resource       ore / reagents / recruits -- what the card costs
//   Cost           how much of that resource
//   Weight         draw weight (the remake's 'prob'): a 3 is drawn three times as often as a 1
//   Effect         <self|enemy> <stat> <amount>, one line each, applied in order.
//                  stat = tower wall ore reagents recruits oreprod reagentprod recruitprod,
//                  or 'damage' (hits the wall first, the rest goes to the tower)
//   Special        a conditional card, handled by name in include/arcocards.inc (no Effect lines)
//   PlayAgain      1 = the player takes another action this turn
//   DrawDiscard    1 = draw 1, discard 1, then play again
//   Undiscardable  1 = can't be discarded
// Stats never go below 0; production (oreprod/reagentprod/recruitprod) never below 1.

