// Arcomage rule sets -- one per NPC. Generated 2026-10-23 from the arcomage-hd remake's
// tavern presets; the comment above each block names the original tavern it came from.
// The rule-set number is the permanent key: records, the NPC template (arcomageNN) and
// spawnpoints.cfg all use it, so renaming an NPC never breaks anything.
//
// Tier is display only (1 = short game ... 7, Lords = the remake's extra castles).
// Title is shown after the NPC's name and, in gold, in its tooltip (UO skill-title ladder by tier).
// Start values: Tower Wall OreProd ReagentProd RecruitProd Ore Reagents Recruits.
// A player wins on WinTower, on any resource reaching WinResource, or when the enemy tower hits 0.
// CardsInHand is the hand size between turns; a player holds one more while choosing.

