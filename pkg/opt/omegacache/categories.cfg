// Omega Cache - Item Categories
//
// Category display order on the main menu is controlled by the number next
// to each name below (lower = earlier) -- NOT by the physical line order.
// See LoadCategoryLookup()/ShowCategoryMenu() in omegacache.inc. To move a
// category, change its number; numbers are spaced by 100 so a new category
// can be slotted in later without renumbering everything else.
//
// Within a Category block, the number next to each objtype is a sort weight
// for that category's item list (lower = earlier), then alphabetical by
// name as a tiebreak. Default is 1 -- since most entries still have that
// same value, they have no explicit order yet and fall through to
// alphabetical. Edit a specific item's number away from 1 to pin it
// somewhere; everything else keeps sorting alphabetically around it.
//
// NEVER use 0 as a weight: 0 is falsy, and the code that reads it
// (ShowItemList in omegacache.inc) checks the value's truthiness, not
// whether it was actually set -- a weight of 0 silently gets treated as
// "unconfigured" and falls back to the alphabetical default of 1 instead.
// Use 1 for plain alphabetical (the default -- no need to write it
// explicitly). For a category you're manually ordering item-by-item, start
// at 10 and increment by 10 per rank (10, 20, 30, ...), leaving room to
// insert an item between two existing ranks later without renumbering
// everything.
//
// Names in comments are for reference only. Display names are read from
// itemdesc at runtime.

