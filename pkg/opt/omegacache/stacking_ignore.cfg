// stacking_ignore.cfg — cache-specific CProp ignore additions.
//
// Effective Omega Cache ignore set is built as:
// 1) config/stacking.cfg IgnoreCprops (engine baseline)
// 2) plus entries in this file (cache-specific additions)
// 3) minus protected gameplay-significant CProps (BaseName, foodvalue)
//
// Items that differ ONLY by ignored CProps share a cache key and stack together.
// Ignored CProps are not persisted per key and therefore not restored on withdraw.
//
// See also: config/stacking.cfg

// fromLoot on Alryc's request to allow looted items to stack irrespective
// of their loot origin

IgnoreCProps
{
	fromLoot       1
}
