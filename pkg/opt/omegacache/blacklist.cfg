// blacklist.cfg — items excluded from Omega Cache storage even if stackable.
//
// Format: one element per blacklisted objtype.
// "Reason" property documents why the item is blacklisted.

// 2026-09-13: removed the Gold Ingot blacklist entry that used to be here
// (0x1BE9, "not a real item on this shard, graphic used by clay"). Neither
// half of that reason holds up anymore: pkg/std/mining/itemdesc.cfg has a
// real, implemented GoldIngot entry at 0x1BE9 (its own comment there says it
// was "previously unimplemented dead code" -- i.e. this blacklist entry was
// accurate when written, then went stale once someone implemented the item
// and never removed the block), and Clay is a completely different objtype
// (UOBJ_CLAY = 0xee19, scripts/include/objtype.inc) -- they never shared a
// graphic. categories.cfg already lists 0x1BE9 as a valid, categorized
// storable item, so this blacklist entry was silently overriding that and
// blocking Gold Ingot storage for no real reason. Silver (0x1BF5) and Copper
// (0x1BE3) coin-melted ingots were never blacklisted and have their own real
// itemdesc entries too -- confirmed fine, no change needed for those.

Blacklist 0x3B9A
{
    Reason  Zulu coin - does not exist on this shard
}
