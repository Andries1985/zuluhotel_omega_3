// Quest Package - quest definitions
//
// Fields:
//   Name         Display name shown in the journal / quest-giver gump
//   Description  Shown when a quest-giver NPC offers this quest
//   Giver        Tag matched against a quest-giver NPC's "QuestGiverTag" CProp
//   GiverName    Display name of the giver, used by anything that needs to point
//                a player back at them by name (e.g. a gated ritual altar's refusal message)
//   TrackX       Optional world X SendQuestArrow points at from the journal's Track button
//   TrackY       Optional world Y (TrackX/TrackY are omitted together if the quest has no single trackable spot)
//                NOTE: the GM ".questmap" teleport tool does NOT read these -- it finds ritual
//                altars/quest-givers live in the world instead (via RitualAltarQuestId/
//                QuestGiverTag CProps, see pkg/opt/questpkg/include/questmapgump.inc), so it
//                stays accurate with no config to update when something is placed or destroyed.
//   ObjText<n>   Objective text, numbered from 1, read until a number is missing (see rituals.cfg's Speech<n> for the same self-terminating convention)
//   ObjCount<n>  How many kills are needed for that objective
//   RewardText   Sysmessage shown on completion
//   RewardGold   Gold handed to the player on completion
//   RewardItem   Objtype of one item created in the player's backpack on completion
//   TurnInItem   Objtype of an item the player must still be carrying to turn in --
//                matched by its "QuestId" CProp equaling this quest's id (not just
//                objtype), so a generic trophy objtype shared across quests can't be
//                turned in to the wrong one. Consumed (destroyed) on completion.
//   Repeatable   1 = can be re-accepted after being turned in (state resets); omitted/0 = one-time only
//   RepeatCooldown  Seconds after turn-in before a Repeatable quest can be re-accepted.
//                   Omitted/0 = no cooldown, re-offered immediately.
//   SkillId      A SKILLID_* constant's numeric value (see scripts/include/constants/
//                skillids.inc) -- paired with MinSkill to gate whether a giver offers
//                this quest at all. Ignored once a quest is active or ready to turn in,
//                so a skill dropping mid-quest can't strand a player partway through.
//   MinSkill     Effective skill (via GetEffectiveSkill) required in SkillId's skill.
//   ObjKind<n>   "CatchFish" or "CatchCrustacean" -- makes objective <n> a catch quest
//                (advanced by pkg/std/fishing's ResolveFishCatch()/CollectTrap() via
//                QP_ProcessFishCatch(), questpkg/include/questfishing.inc) instead of a
//                kill quest (advanced by questdeath.inc's tagged-NPC-death hook).
//   ObjTier<n>   Optional, catch quests only: "Regular"/"Rare"/"Legendary"/"Any"
//                (default). Restricts which catch tier counts toward the objective.
//   ObjMinWeight<n>  Optional, catch quests only: minimum TrophyWeight (in stones) the
//                     catch must roll to count. TrophyWeight is only ever rolled on
//                     Rare/Legendary catches, so this implicitly requires one of those.
//
// Quest id ranges (all quests share this one file, keep this in sync -- a repeated
// integer key silently shadows the earlier one):
//   1-99    existing/core (ritual quests currently occupy 2-11)
//   100-199 fishing (100-103 fish line, 104-107 crustacean line)
//   200+    reserved for whatever's next

// First real quest content. Non-repeatable -- once turned in, it's done for
// that character for good. Must be accepted from Valthor before the ritual
// altar (Item 0xBA41 "ritualaltar134ew" / Item 0xBA42 "ritualaltar134ns",
// pkg/opt/rituals/config/itemdesc.cfg)
// at Dracham Cemetery will do anything (pkg/opt/rituals/altar/use.src checks
// QP_IsQuestActive), and the altar only answers once per accept (its
// "AltarUsed" quest flag, set once the reagent gump's Summon fires --
// pkg/opt/rituals/altar/gump.inc). Summoning drops Voranth the Unhallowed
// (config/npcdesc.cfg NpcTemplate voranthunhallowed); killing him advances
// the objective below and drops a trophy item on his corpse
// (pkg/opt/rituals/include/altarquest.inc) -- NOT the chant book. The real
// reward only comes from RewardItem here, on turn-in with Valthor, so the
// boss kill alone can't skip the trip back. If something goes wrong (boss
// didn't spawn, someone else killed it and took the trophy), abandon from
// the quest journal (QP_AbandonQuest) and re-accept from Valthor to retry --
// abandoning doesn't count as completing, so it's still available afterward
// despite not being Repeatable.
Quest 2
{
	Name		The Rite of Consecration
	Description	Something ancient and unclean festers beneath Dracham Cemetery, smothering ground that was once hallowed. I can teach you the Rite of Consecration to cleanse it -- but first, whatever has claimed that ground must be put down. Offer Bloodmoss and Pig Iron to the cemetery's ritual altar to draw it out, then slay it and bring back proof.
	Giver		valthor
	GiverName	Arch-Mage Valthor

	ObjText1	Slay Voranth the Unhallowed at Dracham Cemetery
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Consecration.
	RewardGold	250
	RewardItem	0xBA40
}

// Same shape as Quest 2, altar (Item 0xBA43/0xBA44 "ritualaltar135ew/ns")
// and boss (NpcTemplate kethrysearthbound) differ. Non-repeatable, same
// abandon/re-accept retry path.
Quest 3
{
	Name		The Rite of Focus
	Description	Dracham Cemetery holds more than Voranth's rot -- deeper in the old ground, a geomancer's grave still pulses with unspent ley-power he never got to bind. I can teach you the Rite of Focus, the working that draws mana into a crystal for later use -- but his hoarded earth-magic has curdled into something hostile first. Offer Ginseng and Black Pearl to the cemetery's second altar to draw it out, then slay it and bring back proof.
	Giver		valthor
	GiverName	Arch-Mage Valthor

	ObjText1	Slay Kethrys the Earthbound at Dracham Cemetery
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Focus.
	RewardGold	250
	RewardItem	0xBA49
}

// Same shape as Quest 2, altar (Item 0xBA45/0xBA46 "ritualaltar132ew/ns")
// and boss (NpcTemplate vaelisoathbroken) differ. Non-repeatable, same
// abandon/re-accept retry path.
Quest 4
{
	Name		The Rite of Attunement
	Description	Not every guardian spirit stays bound. One buried at Dracham Cemetery broke its old oath centuries ago and has haunted the grounds as a hostile thing ever since -- proof, if any was needed, of why the Rite of Attunement must be done properly. Offer Nightshade and Spider Silk to the cemetery's altar to draw the oathbreaker out, then slay it and bring back proof, and I'll teach you the rite that keeps a bound spirit faithful.
	Giver		valthor
	GiverName	Arch-Mage Valthor

	ObjText1	Slay Vaelis the Oathbroken at Dracham Cemetery
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Attunement.
	RewardGold	250
	RewardItem	0xBA4A
}

// Same shape as Quest 2, altar (Item 0xBA47/0xBA48 "ritualaltar146ew/ns")
// and boss (NpcTemplate malgravefouled) differ. Non-repeatable, same
// abandon/re-accept retry path.
Quest 5
{
	Name		The Rite of Purification
	Description	Something at Dracham Cemetery has curdled past saving -- an old caster so thoroughly corrupted by cursed magic that its own name has rotted away with it. Study what remains and you'll understand exactly what the Rite of Purification is meant to wash clean. Offer Garlic and Sulphurous Ash to the cemetery's altar to draw it out, then slay it and bring back proof.
	Giver		valthor
	GiverName	Arch-Mage Valthor

	ObjText1	Slay Malgrave the Fouled at Dracham Cemetery
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Purification.
	RewardGold	250
	RewardItem	0xBA4B
}

//////////////////////////////////////////////////
// Frostkeeper Ysolde - Winterwyn's Everfrost Catacombs (Quest 6-8)
//////////////////////////////////////////////////

// Second quest-giver area, same shape as Quests 2-5. Altar (Item 0xBA4C/
// 0xBA4D "ritualaltar140ew/ns") and boss (NpcTemplate zerithdiscordant) are
// in Winterwyn's Everfrost Catacombs this time, given out by Ysolde in
// Winterwyn rather than Valthor. Non-repeatable, same abandon/re-accept
// retry path.
Quest 6
{
	Name		The Rite of Dissimal
	Description	Something in the Everfrost Catacombs has been unraveling spellwork for as long as anyone can remember -- casters who wander too deep come back complaining their magic feels wrong for days after, if they come back at all. I can teach you the Rite of Mana Dissimal, the working that grants an item's bearer some peace from petty spells -- but you'll need to see firsthand what happens when a caster has none. Offer Mandrake Root and Black Pearl to the catacombs' ritual altar to draw it out, then slay it and bring back proof.
	Giver		ysolde
	GiverName	Frostkeeper Ysolde

	ObjText1	Slay Zerith the Discordant in Winterwyn's Everfrost Catacombs
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Mana Dissimal.
	RewardGold	250
	RewardItem	0xBA52
}

// Same shape as Quest 6, altar (Item 0xBA4E/0xBA4F "ritualaltar141ew/ns")
// and boss (NpcTemplate vornaxfluxbound) differ. Non-repeatable, same
// abandon/re-accept retry path.
Quest 7
{
	Name		The Rite of Flux
	Description	Deeper still in the Everfrost Catacombs, something has been drawing in raw magical chaos and never letting any of it settle -- a living storm with no calm at its center. That imbalance is exactly what the Rite of Mana Flux is meant to bind safely into an item instead. Offer Sulphurous Ash and Nightshade to the catacombs' altar to draw it out, then slay it and bring back proof, and I'll teach you the rite properly.
	Giver		ysolde
	GiverName	Frostkeeper Ysolde

	ObjText1	Slay Vornax the Fluxbound in Winterwyn's Everfrost Catacombs
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Mana Flux.
	RewardGold	250
	RewardItem	0xBA53
}

// Same shape as Quest 6, altar (Item 0xBA50/0xBA51 "ritualaltar152ew/ns")
// and boss (NpcTemplate skarnfrostfang) differ. Non-repeatable, same
// abandon/re-accept retry path.
Quest 8
{
	Name		The Rite of Venom Bane
	Description	The cold in the Everfrost Catacombs should have killed any poison in it long ago. It hasn't. Something down there carries a venom that shouldn't be able to survive the frost, and understanding why is the first step toward the Rite of Venom Bane -- the working that seals an item against poison for good. Offer Garlic and Spider Silk to the catacombs' altar to draw it out, then slay it and bring back proof.
	Giver		ysolde
	GiverName	Frostkeeper Ysolde

	ObjText1	Slay Skarn the Frostfang in Winterwyn's Everfrost Catacombs
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Venom Bane.
	RewardGold	250
	RewardItem	0xBA54
}

//////////////////////////////////////////////////
// Nystul the Enchanter - Arcanus (Quest 9-11)
//////////////////////////////////////////////////

// Third quest-giver area, same shape as Quests 2-8, but Balron-tier
// bosses (see config/npcdesc.cfg NpcTemplate astaroth/nosfentor/faulinei
// -- 14,000 real HP, the real Balron spell kit, chaosspellkillpcs AI) and
// 4 reagents at 100 each instead of the usual 2 at 50. Altar (Item
// 0xBA55/0xBA56 "ritualaltar131ew/ns") sits at the south structure on the
// 2-structure island near Arcanus. Non-repeatable, same abandon/re-accept
// retry path.
Quest 9
{
	Name		The Rite of Advanced Theurgy
	Description	The isles off Arcanus have never been fully mapped -- too many wizards who tried came back wrong, if they came back at all. One who called herself Astaroth set up on the southern structure of the twin-ruin island and never left; whatever she's become since answers to no name a living voice could still put to her. The Rite of Advanced Theurgy is the deepest working I teach -- every reagent's virtue bound together at once -- and you'll need to see what happens when that binding goes wrong before I trust you with it done right. Offer Eye of Newt, Obsidian, Ginseng, and Black Pearl to the ruin's altar to draw her out, then slay her and bring back proof.
	Giver		nystul
	GiverName	Nystul the Enchanter

	ObjText1	Slay Astaroth, Shadow of Falsehood, on the twin-ruin island near Arcanus
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Advanced Theurgy.
	RewardGold	500
	RewardItem	0xBA5B
}

// Same shape as Quest 9, altar (Item 0xBA57/0xBA58 "ritualaltar145ew/ns")
// at the north structure on the same island, boss (NpcTemplate
// nosfentor) differs. Non-repeatable, same abandon/re-accept retry path.
Quest 10
{
	Name		The Rite of Protective Aura
	Description	The northern structure on that same ruined island answers to something worse than Astaroth -- a thing called Nosfentor, if it ever answers to being called anything at all. Sailors who pass too close report their tempers fraying for days after, fights breaking out over nothing, as if some of its hatred rides home with them. The Rite of Protective Aura wraps its bearer in calm at the center of any storm of violence -- exactly the shelter you'll understand the need for once you've stood in front of what that ruin holds. Offer Pumice, Fertile Dirt, Mandrake Root, and Spider Silk to the ruin's altar to draw it out, then slay it and bring back proof.
	Giver		nystul
	GiverName	Nystul the Enchanter

	ObjText1	Slay Nosfentor, Shadow of Hatred, on the twin-ruin island near Arcanus
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Protective Aura.
	RewardGold	500
	RewardItem	0xBA5C
}

// Same shape as Quest 9, altar (Item 0xBA59/0xBA5A "ritualaltar138ew/ns")
// on the second, uninhabited island near Arcanus (the one with the old
// altar and scenery already standing -- place this one alongside it, not
// over it), boss (NpcTemplate faulinei) differs. Faulinei alone carries
// an added spell paralyze on top of the shared Balron kit, so it can
// physically root a player in place -- the literal thing Free Movement
// exists to grant freedom from. Non-repeatable, same abandon/re-accept
// retry path.
Quest 11
{
	Name		The Rite of Free Movement
	Description	There's a second island past the twin ruins -- no buildings on it, just old standing stones around an altar nobody living put there. Every ship's crew that's anchored nearby tells the same story: for a few minutes after making landfall, their legs simply stop answering. Something called Faulinei is still down there, and it doesn't let go easily. The Rite of Free Movement grants its bearer freedom from exactly that kind of hold -- but you'll need to break Faulinei's grip on you at least once the hard way first. Offer Batwing, Pig Iron, Garlic, and Nightshade to the island's altar to draw it out, then slay it and bring back proof.
	Giver		nystul
	GiverName	Nystul the Enchanter

	ObjText1	Slay Faulinei, Shadow of Cowardice, on the standing-stone island near Arcanus
	ObjCount1	1

	TurnInItem	0xBA3F

	RewardText	You have learned the truth behind the Rite of Free Movement.
	RewardGold	500
	RewardItem	0xBA5D
}

