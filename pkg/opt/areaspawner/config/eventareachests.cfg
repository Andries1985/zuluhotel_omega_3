# EventAreaChests - curated chest GRAPHICS for Event Chest Area Spawners
# (pkg/opt/areaspawner). Separate catalog from config/areachests.cfg so event
# content can diverge (special/rarer event-only chest types, etc.) without
# touching what regular Chest spawners offer. Starts as a plain copy of
# areachests.cfg.
#
# Only picks which physical chest shape spawns - the loot inside, lock
# difficulty, and trap are always rolled automatically at spawn time from
# config/nlootgroup.cfg's lootgroup 301-307 (see TryPlaceAreaSpawnerChest in
# include/areaspawner.inc), same as pkg/opt/spawnpoint's Container spawnpoints.
#
# chest <id>
# {
#     label <name>            - human-readable name, shown in the chest browser
#     item <itemdesc template> - one or more (facing variants etc.), picked at random like group's "spawn"
# }

chest 1
{
	label WoodenChest
	item WoodenChestEast
	item WoodenChestSouth
}

