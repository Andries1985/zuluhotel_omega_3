# AreaGroups - spawn groups used by Area Spawners (pkg/opt/areaspawner)
#
# group <id>
# {
#     label <name>       - human-readable name, shown in the group browser
#     spawn <npc template>
# }
#
# Organized by npcdesc.cfg SlayType (CProp Type sXxx), one block of 100 IDs per
# slaytype, tiered by health pool / CProp Boss-SuperBoss-LesserBoss into:
#   x00 Peons     - weak, low total-STR (STR + CProp BaseStrmod), no Boss-tier CProp
#   x01 Warband   - regular mobs, no Boss-tier CProp
#   x02 Horde     - elevated total-STR, no Boss-tier CProp yet - between Warband and Elders
#   x03 Elders    - CProp LesserBoss i1
#   x04 Paragons  - CProp Boss i1
#   x05 Titans    - CProp SuperBoss i1
#
