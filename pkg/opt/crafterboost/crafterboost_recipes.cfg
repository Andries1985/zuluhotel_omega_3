////////////////////////////////////////////////////////////////////////////
// crafterboost_recipes.cfg
//
// Recipe data for the Refinement Generator's real choice gump (see
// refinement_gump.src), replacing the old make_crafter_boosts.src
// Target()-chain (still untouched, still used by the legacy Smithy Retort --
// see itemdesc.cfg's comment). Crafting-station rollout, 2026-09-12.
//
// Quantities/skill match the original crafterboost.cfg (CBoost blocks)
// exactly -- Material1 10 / Material2 10 / Skill 100 for all four products --
// just reshaped onto craftmenu.inc's Element schema so the gump can use its
// Ingot/Log/Hide pickable-family auto-detect+picker instead of a plain
// Target(). Alloy is genuinely Blacksmithy already, so it (and the
// Ingot-family Oil variant) uses the shared nominal skill_id directly;
// Varnish/Compound and the Log/Hide Oil variants aren't Blacksmithy at all,
// so their own `Skill` is set to 1 (never blocks) and the real gate is
// CoSkillid/CoSkill instead -- craftmenu.inc only ever takes one skill_id
// for the whole category/detail gump, and CoSkillid is the one place its
// visibility check (CraftMenu_CanMakeElement) supports a second, different
// skill.
////////////////////////////////////////////////////////////////////////////

Element 0x8B02
{
	Name			Refining Alloy
	Category		Alloy
	Skill			100
	Material		10
	MaterialType		Ingot
	Material2		10
	Material2Type		Bloodspawn
	Material2Objtype	0x0F7C
}

Element 0x8B03
{
	Name			Refining Varnish
	Category		Varnish
	Skill			1
	CoSkillid		11
	CoSkill			100
	Material		10
	MaterialType		Log
	Material2		10
	Material2Type		Daemon Bone
	Material2Objtype	0x0F80
}

Element 0x8B04
{
	Name			Refining Compound
	Category		Compound
	Skill			1
	CoSkillid		34
	CoSkill			100
	Material		10
	MaterialType		Hide
	Material2		10
	Material2Type		Bat Wing
	Material2Objtype	0x0F78
}

// Mending Oil: usable with any of the 3 raw-material families (Ingot/Log/
// Hide) -- 3 separate entries sharing one product, matching Bowcraft's
// "Improve" recipes' ResultObjtype pattern since 0x8B01 can't be 3 different
// cfg keys at once. Synthetic keys (0x9B001-0x9B003) since only one of the
// three can use the real 0x8B01 as its own key.
Element 0x9B001
{
	Name			Mending Oil (Ingot)
	Category		Oil
	Skill			100
	Material		10
	MaterialType		Ingot
	Material2		10
	Material2Type		Brimstone
	Material2Objtype	0x0F7F
	ResultObjtype		0x8B01
}

Element 0x9B002
{
	Name			Mending Oil (Log)
	Category		Oil
	Skill			1
	CoSkillid		11
	CoSkill			100
	Material		10
	MaterialType		Log
	Material2		10
	Material2Type		Brimstone
	Material2Objtype	0x0F7F
	ResultObjtype		0x8B01
}

Element 0x9B003
{
	Name			Mending Oil (Hide)
	Category		Oil
	Skill			1
	CoSkillid		34
	CoSkill			100
	Material		10
	MaterialType		Hide
	Material2		10
	Material2Type		Brimstone
	Material2Objtype	0x0F7F
	ResultObjtype		0x8B01
}
