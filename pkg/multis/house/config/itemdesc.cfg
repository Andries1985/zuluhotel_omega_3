// 2026-08-10: signs are registered directly under their raw graphic
// objtypes (0xBCF/0xBD0/0xBD1/0xBD2) because `uoconvert multis` always
// regenerates config/multis.cfg with these raw values baked in from the
// client's multi.mul/MultiCollection.uop data -- there's no way to make
// uoconvert emit a custom objtype instead, so any scheme that swapped
// these to different objtypes (e.g. 0xFFF0-0xFFF3) silently broke on every
// re-conversion. Registering the raw graphics directly means every item
// in the world with one of these 4 graphics will act as a house sign; no
// other legitimate (non-house) use of these graphics was found in the
// item configs at the time this was done.

// Signs for housing.  These are hardcoded.
Item    0xBCF
{
    Name				woodensign1EW
	Desc				house sign
	Graphic				0xBCF
    Script				:house:multiSign/use
    ControlScript		:house:multiSign/control
    MethodScript		:house:multiSign/method
    Doubleclickrange	10
    movable				0
}

Item    0xBD1
{
    Name				brasssign1EW
	Desc				house sign
	Graphic				0xBD1
    Script				:house:multiSign/use
    ControlScript		:house:multiSign/control
    MethodScript		:house:multiSign/method
    Doubleclickrange	10
    movable				0
}

