///////////////////////////////////////////////////////////////////////////////////////////////
//
//  NPC TEMPLATE REFERENCE  (2026-09-30)
//
//  Every field an NpcTemplate can carry, in the order all templates follow, and what reads it.
//    engine = read by the POL core, script = read by a shard script (both are case-insensitive)
//    CProp  = becomes an ObjProperty on the spawned NPC and is read by name -- CASE-SENSITIVE
//  Template names: letters and digits only (no spaces, no underscores).
//  Values are a number, a word, or -- where noted -- a dice string such as 1d20+180.
//  Layout: one tab indent, values at column 40, a blank line between the groups shown below;
//  skill and spell lines are alphabetical inside their group; CProps are ordered as below.
//  Copy this block for a new template. The reformatter (see ainotes/npcdesc-reformat-report-2026-09-30.md)
//  can be re-run to pull hand-edited templates back into this layout.
//
//NpcTemplate exampletemplate
//{
//	Name				<random> the Example	// engine. "<random>" = random name (see title); plain text otherwise, e.g. "a Kappa"
//	ObjType				0x190		// engine. body: 0x190 human male, 0x191 human female, or a creature body id
//	Script				killpcs		// engine. AI script under scripts/ai/ (names listed in scripts/include/constants/npcai.inc)
//	Color				2669		// engine. hue at spawn
//	TrueColor			2669		// engine. hue restored after temporary recolours -- keep it equal to Color
//	Gender				0		// engine. 0 male, 1 female
//	title				1		// script (setup.inc). only with a <random> Name: appends a random townsfolk title
//	dress				poor		// script (dressme). randomised civilian outfit + hair: poor rich playermerchant warrior weakwarrior mage -- wins over Equip
//	Equip				archangel	// script. equip.cfg block (Weapon / Armor / Equip lines): a fixed loadout
//	mount				0x3eaa 2760	// script (setup). ridden mount: graphic hue
//	MoveMode			L		// engine. terrain letters: L land, S sea, A air -- combine them: AL flies and walks, LS amphibious
//	RunSpeed			200		// engine. step pacing: sleep per step = 1000 - RunSpeed*3 ms, never under NpcMinimumMovementDelay 250 ms (halved while running). Every template sets it
//	MoveSpeed			Fast		// script (AI). think-delay between move decisions: Fastest 0, Fast 75, Normal 150, Slow 225, Slowest 300 ms; omit = Dex-based
//	Privs				invul		// engine. privileges, e.g. invul (scripts test .Privs too)
//	Settings			invul		// engine. settings flags
//	colorrange			1100 1200	// script (setup). random hue between the two values at spawn
//	dstart				10		// script (anchors.inc). wander-leash radius, dropped where the AI starts; omit = no leash. Past it each step away fails 10% per tile (the old psub)
//	speech				54		// script. speech group id (speechgroup.cfg / speech.cfg)
//	deathsnd			0x150		// script (death.src). sound played on death
//	guardignore			1		// script. town guards leave it alone
//	alignment			evil		// script. good / evil: sign of the computed karma and friendliness checks
//
//	provoke				150		// script (provocation.src, tooltip, GM item). Provocation difficulty (omit = 100)
//	peacemake			150		// script (peacemaking.src, songoffright.src). Peacemaking difficulty (omit = 100) -- seeded from provoke 2026-09-30
//	entice				150		// script (taunt.src). Enticement difficulty (omit = 100) -- seeded from provoke 2026-09-30
//	snoopme				150		// script (snooping.src, tooltip). snooping difficulty; omit = cannot be snooped. An instance ObjProperty of the same name overrides it (areaspawner)
//	stealme				150		// script (snooping.src, tooltip). stealing difficulty; same override rule
//	tameskill			95		// script. minimum Taming to control it (+20 window)
//	food				meat		// script (tamed). what a tamed pet eats (default "all")
//	saywords			1		// script. the NPC talks (speech-group lines)
//
//	STR				100		// attribute. base Strength -- engine cap 6000 (the old BaseStrmod CProp is folded in since 2026-09-30)
//	HITS				250		// vitals hook. max HP -- a number or a dice string, rolled once per NPC and cached
//	HITSREGEN			12		// vitals hook (modsetup.inc). HP regen in points per minute, decimals allowed; omit = 12; dice allowed; the engine caps any rate at 300/min. A tool override set with SetNpcVitalOverride(npc, "HITSREGEN", n) wins over it (not a CProp)
//	INT				100		// attribute. base Intelligence
//	MANA				100		// vitals hook. max Mana, number or dice
//	MANAREGEN			12		// vitals hook. mana regen per minute (see HITSREGEN)
//	DEX				100		// attribute. base Dexterity (engine cap 6000); sets swing speed: 15000 / ((DEX+100) x weapon Speed) s
//	STAM				100		// vitals hook. max Stamina, number or dice
//	STAMREGEN			12		// vitals hook. stamina regen per minute (see HITSREGEN)
//	AR				30		// engine. natural armour rating
//
//	Magery				150		// skills: one line per skill, spelt as the Attribute names in
//	MaceFighting			150		//   pkg/systems/attributes/config/attributes.cfg (MaceFighting, EvaluatingIntelligence, DetectingHidden...)
//	Tactics				150		//   value = skill points (150 = shard cap); alphabetical
//	AttackSpeed			40		// engine. its presence makes the core build an invisible weapon for an NPC that wields nothing
//	AttackDamage			2d8		// engine. built-in weapon damage dice (omegaattack.inc reads it too)
//	AttackAttribute			MaceFighting	// engine. skill the built-in weapon swings with (hit chance, skill gain)
//							// also accepted by the engine: AttackHitScript AttackHitSound AttackMissSound AttackAnimation AttackMinRange AttackMaxRange AttackProjectile* AttackDelay AttackSkillId
//	missileweapon			elfbow		// script (archersetup). equip.cfg block for the bow; used with ammotype / ammoamount
//	ammotype			arrow		// script. ammo item put in the pack
//	ammoamount			50		// script. how many
//
//	cast_pct			10		// script. % chance per AI tick to cast (default 10)
//	num_casts			3		// script. casts per casting burst
//	spell				fireball	// casters: one line per spell (names from scripts/include/npccast.inc GetSpellID); alphabetical
//
//	lootgroup			106		// script. nlootgroup.cfg group rolled on death
//	noloot				1		// script. corpse gets no loot
//	MagicItemChance			99		// script. % chance a loot item is magic
//	MagicItemLevel			9		// script. magic level 1-11 (starteqp.inc)
//
//	CProp	Type			sHuman		// slayer type (index below). s = string, i = integer; names are case-sensitive
//	CProp	FireProtection		i40		// 0-100 protection against fire damage (WaterProtection, AirProtection... likewise)
//	CProp	WaterProtection		i40		// 0-100 protection against that damage type
//	CProp	AirProtection		i40		// 0-100 protection against that damage type
//	CProp	EarthProtection		i40		// 0-100 protection against that damage type
//	CProp	NecroProtection		i40		// 0-100 protection against that damage type
//	CProp	HolyProtection		i40		// 0-100 protection against that damage type
//	CProp	PhysicalProtection	i40		// 0-100 protection against that damage type
//	CProp	PermMagicImmunity	i6		// permanent magic immunity level
//	CProp	PermPoisonImmunity	i5		// permanent poison immunity level
//	CProp	Permmr			i5		// permanent magic reflection level
//	CProp	FreeAction		i1		// paralysis immunity
//	CProp	HealingIncrease		i1		// healing bonus level
//	CProp	AttackTypeImmunities	s...		// attack-type immunity list (cleared when the pet is stabled)
//	CProp	IsMage			i1		// class flag used by AI/combat -- one per class: IsBard IsBladesinger IsCrafter IsMage IsMysticArcher IsPaladin IsRanger IsThief IsWarrior IsPowerplayer
//	CProp	IsWarrior		i1		// class flag (see IsMage)
//	CProp	IsRanger		i1		// class flag (see IsMage)
//	CProp	IsThief			i1		// class flag (see IsMage)
//	CProp	IsBard			i1		// class flag (see IsMage)
//	CProp	IsBladesinger		i1		// class flag (see IsMage)
//	CProp	IsCrafter		i1		// class flag (see IsMage)
//	CProp	IsMysticArcher		i1		// class flag (see IsMage)
//	CProp	IsPaladin		i1		// class flag (see IsMage)
//	CProp	IsPowerplayer		i1		// class flag (see IsMage)
//	CProp	LesserBoss		i1		// boss tiers: LesserBoss Boss SuperBoss Champion (no snooping, loot lottery, tooltips...)
//	CProp	Boss			i1		// boss tier (see LesserBoss)
//	CProp	SuperBoss		i1		// boss tier (see LesserBoss)
//	CProp	Champion		i1		// boss tier (see LesserBoss)
//	CProp	QuestGiverTag		smariah		// quests package: gives that quest (also blocks snooping/stealing)
//	CProp	MerchantType		sX		// merchant.src stock type
//	CProp	untamable		i1		// cannot be tamed or controlled
//	CProp	DonatorMount		i1		// donator mount handling (no stabling)
//	CProp	ExplosionPotionType	i0xdc07		// potion objtype an explosion-throwing AI uses
//	CProp	EBSummons		i1		// counts as a summon for banish-type attacks
//	CProp	FinalDeath		i1		// PROPID_MOBILE_FINAL_DEATH
//	CProp	rise			skapparat	// on death, spawn this template in its place after risedelay seconds
//	CProp	risedelay		i5
//	CProp	event			i1		// event / champ-spawn creature (no taming, reputation exceptions)
//	CProp	target			i1		// read by 2 scripts: pkg/opt/areas/callguards.src, scripts/ai/instakillguard.src
//	CProp	referee			i1		// PvP arena referee
//	CProp	wool			i1		// shearable: wool difficulty
//	CProp	BaseTemplate		sarchangel	// chaos Lords only: template it splits back into
//	CProp	merged			i1		// chaos Lords only: already a Lord
//	CProp	nocorpse		i1		// read by 2 scripts: pkg/opt/champspawns/include/death.inc, scripts/misc/death.src
//	CProp	guardkill		i1		// killed by guards: no loot
//	CProp	looter			i1		// the AI loots corpses
//}
//
//  Readable by scripts but unused by any template today (add to a template when needed, in the group they belong to):
//    count_casts, flee_point (combat: flee below this HP%, default 10), attackhitsound (tamed), blockcircle (menogguard), undead (npcinfo.inc), nocorpse as a field (npcinfo.inc)
//
//  RETIRED / DEAD -- do not add these:
//    CProp CustomHitsLevel / CustomManaLevel / CustomStaminaLevel  -> HITS / MANA / STAM fields (2026-09-30)
//    CProp MoveSpeed                                                -> MoveSpeed field (2026-09-30)
//    CProp BaseHpRegen / BaseManaRegen / BaseStaminaRegen           -> HITSREGEN / MANAREGEN / STAMREGEN fields in points per minute (2026-09-30; old value x 12 / 100)
//    CProp snoopme / stealme                                        -> snoopme / stealme fields (2026-09-30)
//    CProp BaseStrmod / BaseIntmod / BaseDexmod                     -> folded into STR / INT / DEX (2026-09-30); the engine rejects temp mods past +/-3000 and never saves them
//    hostile field: never read (IsHostile() had no callers; removed 2026-09-30).  psub field: anchors.inc now uses 10 for everyone
//    Karma / Fame fields: never read (karma is computed at AI start).  prop, graphics, virtue: never read
//    buddytext / leadertext / targettext fields: the scripts read leaderText/buddyText/targetText ObjProperties, never these fields
//    CProp kappa, vortexnaga, mountspawn, pack, PoisonProtection, Equipt/equipt: nothing reads them
//
//
//  Dev Alryc - Organized into Slayer Types
//  Search Slayer Type sType (Slayer Type sOrc) to find the headers of each type
//  Search Boss's to get each bosses of each type
//  Champion for champ bosses
//  Townsfolk for townpeople
//  Ostards or drakes or dragons headers as well
//	Mounts as a header
//		slaytype := "Slime";
//		slaytype := "Ratkin";
//		slaytype := "Plant";
//		slaytype := "Animal";
//		slaytype := "Beholder";
//		slaytype := "Orc";
//		slaytype := "Terathan";
//		slaytype := "Ophidian";
//		slaytype := "Animated";
//		slaytype := "Gargoyle";
//		slaytype := "Troll";
//		slaytype := "Giantkin";
//		slaytype := "Elemental";
//		slaytype := "Undead";
//		slaytype := "Daemon";
//		slaytype := "Dragonkin";
//		slaytype := "Human";
//
