Region The Whole World
{
    UnitsPerArea        30
    SecondsPerRegrow    30
    Capacity            10000
    Range               0 0 5119 4095
    Realm               britannia
}

# Each realm needs its own Region block (with an explicit Realm) even though
# the coordinate ranges overlap with britannia's. The engine's resource
# depletion pool is tied to the Region object, not to (x,y,realm), so realms
# sharing a single Region here would drain/regrow each other's clay
# supply by raw coordinate collision.

Region Sosaria Clay
{
    UnitsPerArea        30
    SecondsPerRegrow    30
    Capacity            10000
    Range               0 0 7167 4095
    Realm               britannia_alt
}

