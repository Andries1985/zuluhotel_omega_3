Region The Whole World
{
    UnitsPerArea        40
    SecondsPerRegrow    60
    Capacity            900000
    Range               0 0 7167 4095
    Realm               britannia
}

# Each realm needs its own Region block (with an explicit Realm) even though
# the coordinate ranges overlap with britannia's. The engine's resource
# depletion pool is tied to the Region object, not to (x,y,realm), so realms
# sharing a single Region here would drain/regrow each other's fish supply
# by raw coordinate collision (e.g. Tokuno's 0-1447,0-1447 aliasing onto
# Britannia's heavily-fished NW corner at the same coordinates).

Region Sosaria Fishing
{
    UnitsPerArea        40
    SecondsPerRegrow    60
    Capacity            900000
    Range               0 0 7167 4095
    Realm               britannia_alt
}

